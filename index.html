<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpeakUp — AI 영어 회화 연습</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- API Key Modal -->
<div class="modal-overlay" id="api-modal">
  <div class="modal">
    <h2>🔑 API 키 입력</h2>
    <p>Claude API 키를 입력하면 AI와 영어 회화 연습을 시작할 수 있어요.<br>키는 브라우저 로컬에만 저장되고 외부로 전송되지 않아요.</p>
    <input type="password" id="api-key-input" placeholder="sk-ant-..." />
    <div class="modal-error" id="api-key-error"></div>
    <button class="modal-save" id="api-key-save">저장하고 시작하기</button>
  </div>
</div>

<!-- Review Modal -->
<div class="modal-overlay" id="review-modal">
  <div class="modal modal--wide">
    <div class="modal-review-header">
      <h2>📄 대화 복습</h2>
      <button id="review-close" class="icon-btn">✕ 닫기</button>
    </div>
    <div id="review-content"></div>
  </div>
</div>

<!-- Header -->
<header>
  <div class="header__logo">Speak<span>Up</span></div>
  <div class="header__scenario" id="scenario-label">주제를 선택하세요</div>
  <div class="header__actions">
    <div class="header__turn">대화 <strong id="turn-count">0</strong>턴</div>
    <span class="save-status" id="save-status"></span>
    <button class="icon-btn" id="history-toggle">📚 세션 히스토리</button>
    <button class="icon-btn" id="change-key-btn">🔑 키 변경</button>
    <div class="theme-switcher">
      <button class="theme-dot theme-dark active" data-theme="dark" title="다크"></button>
      <button class="theme-dot theme-light" data-theme="light" title="라이트"></button>
      <button class="theme-dot theme-pink" data-theme="pink" title="핑크"></button>
      <button class="theme-dot theme-orange" data-theme="orange" title="오렌지"></button>
    </div>
  </div>
</header>

<!-- Layout -->
<div class="layout">

  <!-- Left Panel -->
  <aside class="left-panel">
    <div class="panel-section">
      <div class="panel-section__label">시나리오</div>
      <button class="scenario-btn active" data-scenario="daily"><span class="scen-emoji">☕</span> Daily Chat</button>
      <button class="scenario-btn" data-scenario="business"><span class="scen-emoji">💼</span> Business</button>
      <button class="scenario-btn" data-scenario="travel"><span class="scen-emoji">✈️</span> Travel</button>
      <button class="scenario-btn" data-scenario="interview"><span class="scen-emoji">🎤</span> Interview</button>
    </div>
    <div class="panel-section">
      <div class="panel-section__label">레벨</div>
      <button class="level-btn" data-level="beginner">초급 Beginner</button>
      <button class="level-btn active" data-level="intermediate">중급 Intermediate</button>
      <button class="level-btn" data-level="advanced">고급 Advanced</button>
      <div class="level-desc" id="level-desc">Natural everyday English</div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <!-- Topic Picker -->
    <div id="topic-picker"></div>

    <!-- Chat Area -->
    <div id="chat-area" style="display:none; flex-direction:column; flex:1; overflow:hidden;">
      <div class="chat-topbar">
        <button class="icon-btn" id="change-topic-btn">← 주제 변경</button>
        <button class="icon-btn save-btn" id="save-btn">💾 저장</button>
      </div>
      <div id="chat-box"></div>
      <div class="input-area">
        <div class="input-wrapper">
          <textarea id="user-input" rows="1" placeholder="영어로 입력하거나 🎤 눌러서 말하세요..."></textarea>
          <button id="mic-btn" title="마이크로 말하기">🎤</button>
        </div>
        <div class="input-actions">
          <button id="hint-btn">💡 힌트</button>
          <button id="send-btn">보내기</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Sidebar: tabs -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__tabs">
      <button class="tab-btn active" data-tab="feedback">💬 피드백</button>
      <button class="tab-btn" data-tab="history">📚 히스토리</button>
    </div>
    <div class="tab-panel active" id="tab-feedback">
      <div id="feedback-list"></div>
    </div>
    <div class="tab-panel" id="tab-history">
      <div id="session-list"></div>
    </div>
  </aside>

</div>

<script src="js/scenarios.js"></script>
<script src="js/api.js"></script>
<script src="js/storage.js"></script>
<script src="js/chat.js"></script>
<script src="js/mic.js"></script>
<script src="js/app.js"></script>
</body>
</html>
